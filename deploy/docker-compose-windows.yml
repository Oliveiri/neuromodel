version: "3.9"

# ====================================================================
# Neuro Demo - Windows 一体机部署
# 将此文件提到 IdeaProjects/ 目录下（网上提两层），
# 与 neuro-demo / neuro-model-5.6 / pathology_inference 平级。
#
# 使用前：一体机提前创建好 C:\data\wsi  C:\data\tiles  C:\data\artifacts  C:\data\models
#
# 启动: docker compose -f docker-compose-windows.yml build
#       docker compose -f docker-compose-windows.yml up -d
# ====================================================================

services:

  # ================================================================
  # Spring Boot API 网关
  # ================================================================
  spring:
    build:
      context: ./neuro-demo
      dockerfile: Dockerfile
    container_name: neuro-spring
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-neurochat123}
    volumes:
      - C:/data/wsi:/data/wsi
      - C:/data/tiles:/data/tiles
      - C:/data/artifacts:/data/artifacts
    depends_on:
      mysql:
        condition: service_healthy

  # ================================================================
  # M1 - 肿瘤四分类 (ResNet18 + BentoML)
  # ================================================================
  m1-tumor-cls:
    build:
      context: ./neuro-model-5.6/neuro-models/m1-tumor-cls
      dockerfile: Dockerfile
    container_name: model-m1
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
    volumes:
      - C:/data/wsi:/data/wsi:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ================================================================
  # M2-ccRCC - 透明细胞癌分割 (UNet + BentoML)
  # ================================================================
  m2-ccrcc:
    build:
      context: ./neuro-model-5.6/neuro-models/m2-ccrcc
      dockerfile: Dockerfile
    container_name: model-m2-ccrcc
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ================================================================
  # M2-pRCC - 乳头状细胞癌分割 (UNet + BentoML)
  # ================================================================
  m2-prcc:
    build:
      context: ./neuro-model-5.6/neuro-models/m2-prcc
      dockerfile: Dockerfile
    container_name: model-m2-prcc
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ================================================================
  # M3 - 细胞核分割 (FastAPI + turing_segment)
  # ================================================================
  m3-nuclei:
    build:
      context: ./neuro-model-5.6/neuro-models/m3-nuclei
      dockerfile: Dockerfile
      args:
        TURING_SEGMENT_PKG: ${TURING_SEGMENT_PKG:-turing_segment}
        TURING_SEGMENT_PIP_INDEX_URL: ${TURING_SEGMENT_PIP_INDEX_URL:-}
        TURING_SEGMENT_PIP_EXTRA_INDEX_URL: ${TURING_SEGMENT_PIP_EXTRA_INDEX_URL:-}
    container_name: model-m3
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
      M3_MAX_BATCH_SIZE: ${M3_MAX_BATCH_SIZE:-64}
      M3_MAX_INFLIGHT_PER_REQUEST: ${M3_MAX_INFLIGHT_PER_REQUEST:-8}
      M3_GLOBAL_MAX_INFLIGHT: ${M3_GLOBAL_MAX_INFLIGHT:-32}
      M3_SEGMENT_TIMEOUT_SEC: ${M3_SEGMENT_TIMEOUT_SEC:-120}
      M3_MODEL_TYPE: ${M3_MODEL_TYPE:-he2}
      M3_CHANNELS: ${M3_CHANNELS:-0,1,2}
      M3_IMAGE_TYPE: ${M3_IMAGE_TYPE:-cv2}
    volumes:
      - C:/data/tiles:/data/tiles:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ================================================================
  # M4 - 虚拟染色 (CycleGAN + FastAPI)
  # ================================================================
  m4-vstain:
    build:
      context: ./neuro-model-5.6/neuro-models/m4-vstain
      dockerfile: Dockerfile
    container_name: model-m4
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
      M4_CHECKPOINT_DIR: /app/checkpoints
      M4_MAX_BATCH_SIZE: ${M4_MAX_BATCH_SIZE:-64}
    volumes:
      - C:/data/artifacts:/data/artifacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ================================================================
  # Qwen2.5-VL 多模态大模型
  # ================================================================
  qwen-vl:
    build:
      context: ./pathology_inference
      dockerfile: Dockerfile
    container_name: qwen-vl
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
      MODEL_PATH: /data/models
      BASE_TILE_PATH: /data/tiles
    volumes:
      - C:/data/models:/data/models:ro
      - C:/data/tiles:/data/tiles:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ================================================================
  # MySQL
  # ================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-neurochat123}
      MYSQL_DATABASE: neurochat
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./neuro-model-5.6/deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-neurochat123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ================================================================
  # Qdrant 向量数据库
  # ================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    networks:
      - neuro_internal
    volumes:
      - qdrant_data:/qdrant/storage

  # ================================================================
  # Embedding 服务 — bge-small-zh-v1.5
  # ================================================================
  embedding:
    build:
      context: ./neuro-model-5.6/neuro-models/embedding
      dockerfile: Dockerfile
    container_name: embedding
    restart: unless-stopped
    networks:
      - neuro_internal
    environment:
      TZ: Asia/Shanghai
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# ====================================================================
# 网络
# ====================================================================
networks:
  neuro_internal:
    driver: bridge
    name: neuro_internal

# ====================================================================
# 持久化卷
# ====================================================================
volumes:
  mysql_data:
  qdrant_data:
